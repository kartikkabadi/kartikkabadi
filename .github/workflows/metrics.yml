name: Metrics

on:
  schedule:
    - cron: "0 0 * * 0"  # weekly, Sunday 00:00 UTC
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-light.svg
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_skipped: html, css, dockerfile, shell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_colors: github-light
          config_display: large

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-dark.svg
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_skipped: html, css, dockerfile, shell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_colors: github-dark
          config_display: large

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub metrics"
          file_pattern: "github-metrics-*.svg"
