name: Metrics

on:
  schedule:
    - cron: "0 0 * * 0"  # weekly, Sunday 00:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34.0
        with:
          # Public profile data only; repository writes use the ephemeral token.
          token: ${{ secrets.METRICS_READONLY_TOKEN }}
          user: kartikkabadi
          committer_token: ${{ github.token }}
          output_action: commit
          use_prebuilt_image: no
          filename: github-metrics-light.svg
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_skipped: html, css, dockerfile, shell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_colors: github-light
          config_display: large

      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34.0
        with:
          # Public profile data only; repository writes use the ephemeral token.
          token: ${{ secrets.METRICS_READONLY_TOKEN }}
          user: kartikkabadi
          committer_token: ${{ github.token }}
          output_action: commit
          use_prebuilt_image: no
          filename: github-metrics-dark.svg
          base: header, activity, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_skipped: html, css, dockerfile, shell
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_colors: github-dark
          config_display: large

